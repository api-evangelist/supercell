  - type: Documentation
    url: https://developer.clashroyale.com/#/documentation
- name: Brawl Stars API
  description: Read-only access to Brawl Stars game data — player and club profiles, club
    members, rankings/leaderboards, brawlers, gadgets/star-powers and rotating events.
    Authenticated with a JWT bearer API token whitelisted to specific IPs.
  humanURL: https://developer.brawlstars.com
