aid: supercell
name: Supercell
description: 'Supercell is the Finnish mobile game developer behind Clash of Clans, Clash
  Royale, Brawl Stars, Hay Day, Boom Beach and Squad Busters. Supercell operates three official
  public game APIs — the Clash of Clans API, the Clash Royale API and the Brawl Stars API —
  that expose read-only game data including clan search, global and local leaderboards, player
  and clan profiles, leagues, cards, brawlers, rankings and live events. Access is authenticated
  with a JWT bearer API token created in each game''s developer portal and locked to a set of
  whitelisted IP addresses. Added to the API Evangelist network from a VC-portfolio lead and
  enriched with verified developer-surface artifacts.'
