- name: Clash of Clans API
  description: Read-only access to Clash of Clans game data — clan search, global and local
    leaderboards, clan and player profiles, leagues, war logs, capital raid seasons and the
    Gold Pass season. Authenticated with a JWT bearer API token whitelisted to specific IPs.
