  - type: Documentation
    url: https://developer.clashofclans.com/#/documentation
  - type: GettingStarted
    url: https://developer.clashofclans.com/#/getting-started
- name: Clash Royale API
  description: Read-only access to Clash Royale game data — clan search, player and clan
    profiles, cards, tournaments, challenges, global tournaments and locations/leaderboards.
    Authenticated with a JWT bearer API token whitelisted to specific IPs.
  humanURL: https://developer.clashroyale.com
  baseURL: https://api.clashroyale.com/v1
